<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" font-family="Segoe UI, sans-serif">
  <rect width="760" height="300" fill="#141a26" rx="14"/>
  <text x="380" y="34" fill="#e6e9ef" font-size="18" text-anchor="middle" font-weight="600">Laptop-mu  →  Kantor 3D</text>
  <!-- laptop -->
  <g stroke="#8b93a7" fill="none" stroke-width="2">
    <rect x="60" y="90" width="220" height="130" rx="10"/>
    <path d="M40 240 h260 l-20 -18 h-220 z"/>
  </g>
  <g font-size="12" fill="#aee3ff">
    <text x="80" y="120">chrome.exe   CPU 22%</text>
    <text x="80" y="145">Code.exe     CPU 9%</text>
    <text x="80" y="170">spotify.exe  CPU 2%</text>
    <text x="80" y="195">discord.exe  idle…</text>
  </g>
  <!-- panah ws -->
  <g stroke="#ffd166" stroke-width="3" fill="none">
    <path d="M330 160 h100"/><path d="M415 148 l18 12 -18 12" />
  </g>
  <text x="380" y="140" fill="#ffd166" font-size="12" text-anchor="middle">WebSocket :8765</text>
  <!-- office -->
  <g transform="translate(470,80)">
    <rect x="0" y="0" width="250" height="170" rx="10" fill="#1d2634" stroke="#39445a" stroke-width="2"/>
    <g fill="#3ddc84"><circle cx="60" cy="80" r="10"/><circle cx="110" cy="80" r="10"/></g>
    <g fill="#ef476f"><circle cx="160" cy="80" r="10"/></g>
    <g fill="#4cc9f0"><circle cx="85" cy="120" r="10"/></g>
    <text x="60" y="60" fill="#8b93a7" font-size="11" text-anchor="middle">Budi</text>
    <text x="110" y="60" fill="#8b93a7" font-size="11" text-anchor="middle">Siti</text>
    <text x="160" y="60" fill="#8b93a7" font-size="11" text-anchor="middle">Joko🔥</text>
    <text x="125" y="20" fill="#e6e9ef" font-size="13" text-anchor="middle">🏢 Office-Desktop</text>
    <text x="215" y="150" font-size="16">☕</text>
  </g>
  <text x="380" y="280" fill="#8b93a7" font-size="12" text-anchor="middle">Semakin sibuk laptop → semakin ramai dan “panas” kantornya 💦🔥💨</text>
</svg>
